name: Build Android APK

on:
  push:
    branches:
      - build/rumb-launcher
      - feature/rumb-launcher-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Rumb-Launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == "feature/rumb-launcher-v2" ]]; then
            TAG="v2.0.0"
            TITLE="Rumb Launcher v2.0.0"
          else
            TAG="v1.0.0"
            TITLE="Rumb Launcher v1.0.0"
          fi
          APK="Rumb-Launcher-${TAG}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "Install this debug APK on Android 8.0 or newer, then select Rumb Launcher as your default home app."
          fi
