name: Build Android APK

on:
  push:
    branches:
      - build/rumb-launcher
      - feature/rumb-launcher-v2
      - fix/release-security-hardening
      - fix/full-release-apk
      - feature/reference-ui-install-fix
      - feature/v3.1-smooth-launcher
      - feature/v3.2-power-features
      - feature/v3.3-settings-redesign
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUMB_KEYSTORE_PATH: /tmp/rumb-release-${{ github.run_id }}-${{ github.run_attempt }}.jks
      RUMB_KEYSTORE_PASSWORD: rumb-${{ github.run_id }}-${{ github.run_attempt }}
      RUMB_KEY_ALIAS: rumb-release
      RUMB_KEY_PASSWORD: rumb-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create isolated release signing key
        run: >-
          keytool -genkeypair -noprompt
          -keystore "$RUMB_KEYSTORE_PATH"
          -storepass "$RUMB_KEYSTORE_PASSWORD"
          -alias "$RUMB_KEY_ALIAS"
          -keypass "$RUMB_KEY_PASSWORD"
          -keyalg RSA -keysize 4096 -validity 3650
          -dname "CN=Rumb Launcher, OU=Release, O=Rumb, L=Unknown, ST=Unknown, C=US"

      - name: Lint and build signed release APK
        run: ./gradlew lintRelease assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: Rumb-Launcher-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            feature/v3.3-settings-redesign)
              TAG="v3.3.0"
              TITLE="Rumb Launcher Next v3.3.0"
              ;;
            feature/v3.2-power-features)
              TAG="v3.2.0"
              TITLE="Rumb Launcher Next v3.2.0"
              ;;
            feature/v3.1-smooth-launcher)
              TAG="v3.1.0"
              TITLE="Rumb Launcher Next v3.1.0"
              ;;
            feature/reference-ui-install-fix)
              TAG="v3.0.0"
              TITLE="Rumb Launcher Next v3.0.0"
              ;;
            fix/full-release-apk)
              TAG="v2.2.1"
              TITLE="Rumb Launcher v2.2.1 Full Release"
              ;;
            fix/release-security-hardening)
              TAG="v2.2.0"
              TITLE="Rumb Launcher v2.2.0 Visual Redesign"
              ;;
            feature/rumb-launcher-v2)
              TAG="v2.0.1"
              TITLE="Rumb Launcher v2.0.1"
              ;;
            *)
              TAG="v1.0.0"
              TITLE="Rumb Launcher v1.0.0"
              ;;
          esac
          APK="Rumb-Launcher-${TAG}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "Signed full release for Android 8.0 or newer. V3.x installs as com.rumb.launcher.next to avoid conflicts with old Rumb certificates. Code and resources are not minified or shrunk, and the app has no network permission. Notification dots and the screen-lock gesture are opt-in and need the user to grant access in Android Settings."
          fi
